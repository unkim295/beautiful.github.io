<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL // ROOT_ACCESS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030a04;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            line-height: 1.4;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* 掃描線復古螢幕感 */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        #terminal {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.7);
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 16px;
            background: #00ff66;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* 警報彈窗 */
        #alertBox {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px #ff0055;
            color: #ff0055;
            padding: 25px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>
<body onclick="addCode()" onkeydown="addCode()">

    <div id="terminal"><span id="text"></span><span class="cursor"></span></div>
    
    <div id="alertBox">
        ⚠️ ACCESS GRANTED ⚠️<br>
        <span style="font-size: 0.9rem; color: #fff;">SYSTEM OVERRIDE COMPLETED</span>
    </div>

    <script>
        const fakeSnippets = [
            "INITIALIZING EXPLOIT PAYLOAD [SHA-256]...\n",
            "CONNECTING TO 192.168.0.1:443 -> BYPASSING PROXY...\n",
            "struct group_info init_groups = { .usage = ATOMIC_INIT(2) };\n",
            "int set_current_groups(struct group_info *group_info) {\n",
            "    int i;\n    struct cred *new;\n",
            "    WARN_ON(!atomic_read(&group_info->usage));\n",
            "OVERRIDING MEMORY BUFFER [0x7ffeeb4b28] OK.\n",
            "inject_shellcode(0xdeadbeef, ARCH_X86_64);\n",
            "FETCHING ROOT ENCRYPTION KEYS...\n",
            "FIREWALL STATUS: DISABLED [SUCCESS]\n",
            "DOWNLOADING /etc/shadow [||||||||||||||||||||] 100%\n",
            "root@mainframe:~# GRANT ALL PRIVILEGES TO 'ANON';\n"
        ];

        let index = 0;
        let count = 0;
        const textEl = document.getElementById("text");
        const term = document.getElementById("terminal");
        const alertBox = document.getElementById("alertBox");

        function addCode() {
            textEl.textContent += fakeSnippets[index % fakeSnippets.length];
            index++;
            count++;
            term.scrollTop = term.scrollHeight;

            // 敲滿 15 次觸發一次入侵成功彈窗
            if (count % 15 === 0) {
                alertBox.style.display = "block";
                setTimeout(() => { alertBox.style.display = "none"; }, 1500);
            }
        }

        // 開局先自動打幾行
        addCode(); addCode();
    </script>
</body>
</html>
